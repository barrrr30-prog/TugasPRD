<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel IoT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>Panel IoT</h1>
      <p class="device">Perangkat: <strong id="deviceId">-</strong></p>
    </div>
    <div class="status" id="status" role="status"><span class="dot"></span><span id="statusText">Menghubungkan…</span></div>
  </header>

  <main>
    <section class="readings" aria-label="Pembacaan sensor">
      <div class="reading">
        <span class="label">Suhu</span>
        <span class="value"><span id="temperature">--</span><small>°C</small></span>
      </div>
      <div class="reading">
        <span class="label">Kelembapan</span>
        <span class="value"><span id="humidity">--</span><small>%</small></span>
      </div>
      <div class="trend">
        <span class="label">Tren suhu (data langsung)</span>
        <svg id="spark" viewBox="0 0 300 70" preserveAspectRatio="none" aria-hidden="true"></svg>
        <span class="meta" id="updatedAt">Belum ada data</span>
      </div>
    </section>

    <section class="panel" aria-label="Kontrol">
      <h2>Kontrol</h2>
      <label class="switch"><input type="checkbox" data-control="relay1"><span class="track"></span>Relay 1</label>
      <label class="switch"><input type="checkbox" data-control="relay2"><span class="track"></span>Relay 2</label>
    </section>

    <section class="panel history" aria-label="Riwayat">
      <div class="row">
        <h2>Riwayat di Google Sheets</h2>
        <div class="actions">
          <button id="btnSave">Simpan sekarang</button>
          <button id="btnLoad" class="ghost">Muat riwayat</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Waktu</th><th>Suhu (°C)</th><th>Kelembapan (%)</th></tr></thead>
          <tbody id="historyBody"><tr><td colspan="3" class="empty">Tekan “Muat riwayat” untuk mengambil data.</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="alert"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
